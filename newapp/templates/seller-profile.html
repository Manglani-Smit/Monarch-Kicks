{% extends 'seller-header.html' %}
{% load static %}
{% block content %}

    <style>
       .luxury-profile-banner {
          background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
          border-bottom: 2px solid #c5a059;
          padding: 65px 0 50px;
       }
       .luxury-profile-banner h1 {
          color: #ffffff;
          font-weight: 800;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin: 0;
          font-size: 28px;
       }
       .luxury-profile-banner nav a {
          color: #888888;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 1px;
       }
       .luxury-profile-banner nav a:hover {
          color: #c5a059;
       }
       .profile-section-area {
          background: #fafafa;
          padding: 70px 0 90px;
       }
       .profile-card-luxury {
          background: #ffffff;
          border: 1px solid #ebebeb;
          border-radius: 4px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
          padding: 45px 35px;
          position: relative;
       }
       .profile-card-luxury::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: #c5a059;
          border-radius: 4px 4px 0 0;
       }
       .profile-card-luxury h3 {
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: #111111;
          margin-bottom: 8px;
          text-align: center;
       }
       .profile-card-luxury p.card-subtext {
          font-size: 13px;
          color: #777777;
          text-align: center;
          margin-bottom: 30px;
          letter-spacing: 0.3px;
       }
       .avatar-wrapper {
          position: relative;
          display: inline-block;
          margin-bottom: 25px;
       }
       .profile-img-preview {
          width: 135px;
          height: 135px;
          border-radius: 50%;
          object-fit: cover;
          border: 3px solid #c5a059;
          padding: 4px;
          background: #ffffff;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
       }
       .form-label-luxury {
          font-size: 12px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: #333333;
          margin-bottom: 6px;
          display: block;
       }
       .input-luxury {
          background: #fbfbfb;
          border: 1px solid #e0e0e0;
          border-radius: 2px;
          height: 48px;
          font-size: 14px;
          color: #111111;
          padding: 10px 16px;
          transition: all 0.3s ease;
       }
       .input-luxury:focus {
          background: #ffffff;
          border-color: #c5a059;
          outline: none;
          box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.15);
       }
       .textarea-luxury {
          background: #fbfbfb;
          border: 1px solid #e0e0e0;
          border-radius: 2px;
          font-size: 14px;
          color: #111111;
          padding: 12px 16px;
          transition: all 0.3s ease;
       }
       .textarea-luxury:focus {
          background: #ffffff;
          border-color: #c5a059;
          outline: none;
          box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.15);
       }
       .file-input-luxury {
          background: #fbfbfb;
          border: 1px solid #e0e0e0;
          border-radius: 2px;
          padding: 8px 12px;
          font-size: 13px;
          color: #555555;
          width: 100%;
       }
       .file-input-luxury:focus {
          border-color: #c5a059;
          outline: none;
       }
       .status-alert {
          background: rgba(197, 160, 89, 0.1);
          border: 1px solid #c5a059;
          color: #8c6d2d;
          font-size: 13px;
          font-weight: 600;
          padding: 10px 14px;
          border-radius: 2px;
          margin-bottom: 22px;
          text-align: center;
       }
       .btn-monarch-profile-submit {
          width: 100%;
          background: #111111;
          color: #c5a059;
          border: 1px solid #c5a059;
          height: 50px;
          font-size: 13px;
          font-weight: 800;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          border-radius: 2px;
          cursor: pointer;
          transition: all 0.35s ease;
          margin-top: 10px;
       }
       .btn-monarch-profile-submit:hover {
          background: #c5a059;
          color: #111111;
          border-color: #c5a059;
          box-shadow: 0 6px 20px rgba(197, 160, 89, 0.35);
          transform: translateY(-2px);
       }
    </style>

    <!-- Start Banner Area -->
    <section class="banner-area luxury-profile-banner">
       <div class="container">
          <div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-between">
             <div class="col-first">
                <h1>Curator Dossier</h1>
                <nav class="d-flex align-items-center mt-2">
                   <a href="/">Home<span class="lnr lnr-arrow-right mx-2"></span></a>
                   <a href="{% url 'profile' %}">Curator Profile</a>
                </nav>
             </div>
          </div>
       </div>
    </section>
    <!-- End Banner Area -->

    <!--================Profile Box Area =================-->
    <section class="login_box_area profile-section-area">
       <div class="container">
          <div class="row justify-content-center">
             <div class="col-lg-7 col-md-9">
                <div class="profile-card-luxury">
                   <h3>Curator Credentials</h3>
                   <p class="card-subtext">Manage partner identity, contact coordinates, and boutique location details.</p>

                   {% if msg %}
                   <div class="status-alert">
                      {{ msg }}
                   </div>
                   {% endif %}

                   <form class="row login_form" action="{% url 'profile' %}" method="post" enctype="multipart/form-data" id="registerForm">
                      {% csrf_token %}

                      <!-- Profile Picture Center -->
                      <div class="col-md-12 text-center mb-3">
                         <div class="avatar-wrapper">
                            <img src="{{ user.profile_picture.url }}" alt="Profile Picture" class="profile-img-preview">
                         </div>
                      </div>

                      <div class="col-md-6 form-group text-left mb-3">
                         <label class="form-label-luxury" for="firstname">First Name</label>
                         <input type="text" class="form-control input-luxury" id="firstname" name="fname" value="{{ user.fname }}" required>
                      </div>

                      <div class="col-md-6 form-group text-left mb-3">
                         <label class="form-label-luxury" for="lastname">Last Name</label>
                         <input type="text" class="form-control input-luxury" id="lastname" name="lname" value="{{ user.lname }}" required>
                      </div>

                      <div class="col-md-12 form-group text-left mb-3">
                         <label class="form-label-luxury" for="mobile">Direct Contact Number</label>
                         <input type="tel" class="form-control input-luxury" id="mobile" name="mobile" value="{{ user.mobile }}" required>
                      </div>

                      <div class="col-md-12 form-group text-left mb-3">
                         <label class="form-label-luxury" for="image">Update Curator Portrait</label>
                         <input type="file" class="form-control file-input-luxury" id="image" name="profile_picture" accept="image/*">
                      </div>

                      <div class="col-md-12 form-group text-left mb-4">
                         <label class="form-label-luxury" for="address">Boutique / Warehouse Coordinates</label>
                         <textarea class="form-control textarea-luxury" id="address" name="address" rows="3">{{ user.address }}</textarea>
                      </div>

                      <div class="col-md-12 form-group mb-0">
                         <button type="submit" value="submit" class="btn-monarch-profile-submit">Save Curator Profile</button>
                      </div>

                   </form>
                </div>
             </div>
          </div>
       </div>
    </section>
    <!--================End Profile Box Area =================-->

{% endblock %}
