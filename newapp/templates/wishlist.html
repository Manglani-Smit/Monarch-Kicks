{% extends 'header.html' %}
{% load static %}
{% block content %}

    <style>
       .luxury-wishlist-banner {
          background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
          border-bottom: 2px solid #c5a059;
          padding: 70px 0 50px;
       }
       .luxury-wishlist-banner h1 {
          color: #ffffff;
          font-weight: 800;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin: 0;
          font-size: 28px;
       }
       .wishlist-wrapper-area {
          padding: 60px 0 90px;
          background: #ffffff;
       }
       .single-product-wishlist {
          background: #ffffff;
          border: 1px solid #e8e8e8;
          border-radius: 4px;
          padding: 18px;
          transition: all 0.35s ease;
          position: relative;
          margin-bottom: 30px;
       }
       .single-product-wishlist:hover {
          border-color: #c5a059;
          box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
          transform: translateY(-4px);
       }
       .product-image-container {
          height: 230px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fafafa;
          border-radius: 4px;
          overflow: hidden;
       }
       .product-image-container img {
          max-height: 190px;
          object-fit: contain;
          transition: transform 0.4s ease;
       }
       .single-product-wishlist:hover .product-image-container img {
          transform: scale(1.04);
       }
       .single-product-wishlist .product-details h6 {
          font-weight: 700;
          font-size: 15.5px;
          color: #111111;
          margin-top: 15px;
          margin-bottom: 6px;
          letter-spacing: 0.3px;
       }
       .single-product-wishlist .price h6 {
          color: #c5a059 !important;
          font-weight: 800 !important;
          font-size: 16.5px !important;
       }
       .prd-bottom-wishlist {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
       }
       .prd-bottom-wishlist .social-info {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 8px 14px;
          border-radius: 2px;
          background: #111111;
          border: 1px solid #111111;
          color: #c5a059 !important;
          transition: all 0.3s ease;
          text-decoration: none;
          font-size: 11.5px;
          font-weight: 700;
          letter-spacing: 1px;
          text-transform: uppercase;
       }
       .prd-bottom-wishlist .social-info span {
          margin-right: 6px;
          font-size: 13px;
       }
       .prd-bottom-wishlist .social-info p.hover-text {
          margin: 0;
          display: inline-block;
          color: #c5a059;
       }
       .prd-bottom-wishlist .social-info:hover {
          background: #c5a059;
          border-color: #c5a059;
          color: #111111 !important;
          box-shadow: 0 4px 14px rgba(197, 160, 89, 0.35);
       }
       .prd-bottom-wishlist .social-info:hover p.hover-text {
          color: #111111;
       }
       .wishlist-status-alert {
          background: #fff5f5;
          border: 1px solid #ffcccc;
          color: #d32f2f;
          font-size: 13.5px;
          font-weight: 600;
          padding: 12px 18px;
          border-radius: 2px;
          margin-bottom: 25px;
       }
    </style>

    <!-- Start Banner Area -->
    <section class="banner-area luxury-wishlist-banner">
       <div class="container">
          <div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-between">
             <div class="col-first">
                <h1>Curated Wishlist</h1>
             </div>
          </div>
       </div>
    </section>
    <!-- End Banner Area -->

    <div class="container wishlist-wrapper-area">
       <div class="row justify-content-center">
          <div class="col-lg-12">
             <!-- Status Message Alert -->
             {% if msg %}
             <div class="wishlist-status-alert text-center">
                <b>{{ msg }}</b>
             </div>
             {% endif %}

             <!-- Start Products Grid -->
             <section class="lattest-product-area pb-40 category-list">
                <div class="row">
                {% for i in wishlists %}
                   <div class="col-lg-3 col-md-4 col-sm-6">
                      <div class="single-product-wishlist">
                         <div class="product-image-container">
                            <img class="img-fluid" src="{{ i.product.product_image.url }}" alt="{{ i.product.product_name }}">
                         </div>
                         <div class="product-details text-center">
                            <h6>{{ i.product.product_name }}</h6>
                            <div class="price mb-3">
                               <h6>₹{{ i.product.product_price }}</h6>
                            </div>
                            <div class="prd-bottom-wishlist">
                               <a href="{% url 'add-to-cart' pk=i.product.pk %}" class="social-info" title="Move to Shopping Bag">
                                  <span class="ti-bag"></span>
                                  <p class="hover-text">Add To Bag</p>
                               </a>
                               <a href="{% url 'product-details' pk=i.product.pk %}" class="social-info" title="Inspect Silhouette">
                                  <span class="ti-info-alt"></span>
                                  <p class="hover-text">Details</p>
                               </a>
                            </div>
                         </div>
                      </div>
                   </div>
                {% endfor %}
                </div>
             </section>
             <!-- End Products Grid -->
          </div>
       </div>
    </div>

{% endblock %}
