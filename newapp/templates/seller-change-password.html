{% extends 'seller-header.html' %}
{% load static %}
{% block content %}

    <style>
       .luxury-auth-banner {
          background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
          border-bottom: 2px solid #c5a059;
          padding: 60px 0 45px;
       }
       .luxury-auth-banner h1 {
          color: #ffffff;
          font-weight: 800;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin: 0;
          font-size: 28px;
       }
       .security-section {
          background: #fafafa;
          padding: 85px 0 100px;
       }
       .security-card {
          background: #ffffff;
          border: 1px solid #ebebeb;
          border-radius: 4px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
          padding: 45px 35px;
          max-width: 480px;
          margin: 0 auto;
          position: relative;
       }
       .security-card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: #c5a059;
          border-radius: 4px 4px 0 0;
       }
       .security-card h3 {
          font-size: 20px;
          font-weight: 800;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: #111111;
          margin-bottom: 10px;
          text-align: center;
       }
       .security-card p.subtitle {
          font-size: 13px;
          color: #777777;
          text-align: center;
          margin-bottom: 26px;
          letter-spacing: 0.3px;
          line-height: 1.5;
       }
       .security-input {
          background: #fbfbfb;
          border: 1px solid #e0e0e0;
          border-radius: 2px;
          height: 50px;
          font-size: 14px;
          color: #111111;
          padding: 10px 16px;
          transition: all 0.3s ease;
          letter-spacing: 0.5px;
       }
       .security-input:focus {
          background: #ffffff;
          border-color: #c5a059;
          outline: none;
          box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.15);
       }
       .btn-monarch-submit {
          width: 100%;
          background: #111111;
          color: #c5a059;
          border: 1px solid #c5a059;
          height: 48px;
          font-size: 13px;
          font-weight: 800;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          border-radius: 2px;
          cursor: pointer;
          transition: all 0.35s ease;
          margin-top: 10px;
       }
       .btn-monarch-submit:hover {
          background: #c5a059;
          color: #111111;
          border-color: #c5a059;
          box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3);
          transform: translateY(-2px);
       }
       .status-alert {
          background: rgba(197, 160, 89, 0.1);
          border: 1px solid #c5a059;
          color: #8c6d2d;
          font-size: 13px;
          font-weight: 600;
          padding: 10px 14px;
          border-radius: 2px;
          margin-bottom: 22px;
          text-align: center;
       }
    </style>

    <!-- Start Banner Area -->
    <section class="banner-area luxury-auth-banner">
       <div class="container">
          <div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-between">
             <div class="col-first">
                <h1>Vault Security Protocol</h1>
             </div>
          </div>
       </div>
    </section>
    <!-- End Banner Area -->

    <!-- Start Security Box Area -->
    <section class="security-section">
       <div class="container">
          <div class="row justify-content-center">
             <div class="col-lg-12">
                <div class="security-card">
                   <h3>Update Curator Passcode</h3>
                   <p class="subtitle">Update your credentials to maintain security over curated silhouettes and boutique inventory.</p>

                   {% if msg %}
                   <div class="status-alert">
                      {{ msg }}
                   </div>
                   {% endif %}

                   <form class="row login_form" action="{% url 'change-password' %}" method="post" id="contactForm">
                      {% csrf_token %}
                      <div class="col-md-12 form-group mb-3">
                         <input type="password" class="form-control security-input" id="old_password" name="old_password" placeholder="Current Passcode" required>
                      </div>
                      <div class="col-md-12 form-group mb-3">
                         <input type="password" class="form-control security-input" id="new_password" name="new_password" placeholder="New Passcode" required>
                      </div>
                      <div class="col-md-12 form-group mb-3">
                         <input type="password" class="form-control security-input" id="cnew_password" name="cnew_password" placeholder="Confirm New Passcode" required>
                      </div>
                      <div class="col-md-12 form-group">
                         <button type="submit" value="submit" class="btn-monarch-submit">Authorize Key Change</button>
                      </div>
                   </form>
                </div>
             </div>
          </div>
       </div>
    </section>
    <!-- End Security Box Area -->

{% endblock %}
